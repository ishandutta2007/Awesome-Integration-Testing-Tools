<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing card gradients -->
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>
    <linearGradient id="glowEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.2" />
    </linearGradient>

    <!-- Title text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <!-- Soft radial glow filters -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="0.8" stroke-opacity="0.6" />
    </pattern>
  </defs>

  <style>
    .pulse-glow {
      animation: pulseAnim 6s ease-in-out infinite alternate;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashAnim 20s linear infinite;
    }
    .orbit-node {
      animation: floatNode 8s ease-in-out infinite alternate;
    }
    .card-float-1 {
      animation: cardFloat1 5s ease-in-out infinite alternate;
    }
    .card-float-2 {
      animation: cardFloat2 6s ease-in-out infinite alternate;
    }
    .card-float-3 {
      animation: cardFloat3 5.5s ease-in-out infinite alternate;
    }

    @keyframes pulseAnim {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.7; transform: scale(1.02); }
    }
    @keyframes dashAnim {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes cardFloat1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }
    @keyframes cardFloat2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(7px); }
    }
    @keyframes cardFloat3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
  </style>

  <!-- Deep canvas background -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Technical grid backdrop -->
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <!-- Ambient glowing spheres in background (dynamic pulse) -->
  <g class="pulse-glow">
    <circle cx="200" cy="80" r="140" fill="#4f46e5" opacity="0.15" filter="url(#softGlow)" />
    <circle cx="1020" cy="260" r="160" fill="#06b6d4" opacity="0.15" filter="url(#softGlow)" />
    <circle cx="600" cy="180" r="220" fill="#8b5cf6" opacity="0.12" filter="url(#softGlow)" />
  </g>

  <!-- Animated flow pipelines connecting testing components in the background -->
  <g stroke-linecap="round">
    <path class="flow-line" d="M 120,60 C 350,20 850,20 1080,60" fill="none" stroke="#3b82f6" stroke-width="2" opacity="0.4" />
    <path class="flow-line" d="M 100,300 C 400,340 800,340 1100,300" fill="none" stroke="#8b5cf6" stroke-width="2" opacity="0.4" />
    <path class="flow-line" d="M 150,180 C 300,290 900,70 1050,180" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.3" />
  </g>

  <!-- Floating badges/chips in background margins (dynamic subtle float) -->
  <g class="card-float-1">
    <rect x="60" y="45" width="165" height="42" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.85" />
    <circle cx="82" cy="66" r="6" fill="#6366f1" />
    <text x="96" y="71" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Docker &amp; Containers</text>
  </g>

  <g class="card-float-2">
    <rect x="975" y="45" width="165" height="42" rx="10" fill="#042f2e" stroke="#14b8a6" stroke-width="1.2" opacity="0.85" />
    <circle cx="997" cy="66" r="6" fill="#14b8a6" />
    <text x="1011" y="71" fill="#99f6e4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Mock &amp; WireMock</text>
  </g>

  <g class="card-float-3">
    <rect x="60" y="275" width="175" height="42" rx="10" fill="#0c4a6e" stroke="#0ea5e9" stroke-width="1.2" opacity="0.85" />
    <circle cx="82" cy="296" r="6" fill="#0ea5e9" />
    <text x="96" y="301" fill="#bae6fd" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">LocalStack AWS</text>
  </g>

  <g class="card-float-1">
    <rect x="970" y="275" width="170" height="42" rx="10" fill="#450a0a" stroke="#ef4444" stroke-width="1.2" opacity="0.85" />
    <circle cx="992" cy="296" r="6" fill="#ef4444" />
    <text x="1006" y="301" fill="#fecaca" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Contract &amp; API Tests</text>
  </g>

  <!-- Center Foreground Title & Subtitle (High contrast, clearly visible) -->
  <g text-anchor="middle">
    <!-- Top Pill tag -->
    <rect x="470" y="78" width="260" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="600" y="99" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">⚡ CURATED ECOSYSTEM GUIDE</text>

    <!-- Main Title -->
    <text x="600" y="165" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">Awesome Integration Testing</text>

    <!-- Subtitle -->
    <text x="600" y="206" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500">Containerized Dependencies • Cloud Emulators • Disposable Test Infrastructure</text>

    <!-- Bottom Feature Badges -->
    <g transform="translate(330, 230)">
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="82.5" y="18" fill="#93c5fd" font-family="sans-serif" font-size="12" font-weight="600">🐳 Testcontainers Native</text>

      <rect x="180" y="0" width="180" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="270" y="18" fill="#a7f3d0" font-family="sans-serif" font-size="12" font-weight="600">☁️ Local &amp; Hosted SaaS</text>

      <rect x="375" y="0" width="165" height="28" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="457.5" y="18" fill="#fbcfe8" font-family="sans-serif" font-size="12" font-weight="600">🚀 Production Fidelity</text>
    </g>
  </g>
</svg>